apiVersion: apps/v1
kind: Deployment
metadata:
  name: s04-web
  labels:
    app: s04-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s04-web
  template:
    metadata:
      labels:
        app: s04-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
